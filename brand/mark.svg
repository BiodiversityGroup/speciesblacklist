<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256"
     role="img" aria-label="The Species Black List">
  <title>The Species Black List</title>
  <desc>Three filled register entries above a fourth left blank: the unwritten line.</desc>
  <style>
    .ink { fill:#171A21 }
    .gap { fill:none; stroke:#B4762B; stroke-width:1.7 }
    @media (prefers-color-scheme:dark) {
      .ink { fill:#E6E8EC }
      .gap { stroke:#DCB068 }
    }
  </style>
  <g class="ink">
    <rect x="3" y="4"  width="26" height="4" rx="1.2"/>
    <rect x="3" y="11" width="20" height="4" rx="1.2"/>
    <rect x="3" y="18" width="23" height="4" rx="1.2"/>
  </g>
  <rect class="gap" x="3.85" y="25.85" width="15.3" height="4.3" rx="1.4"/>
</svg>
